<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu</title>
<link rel="stylesheet" href="style/main.css">
</head>
<body>

  <div id="landing" class="page active">
    <div class="landing-inner">
      <h1>Hai...</h1>
      <p class="subtitle">Ada yang ingin aku sampaikan</p>
      <button class="btn-open ripple-wrap" onclick="handleOpen()">BUKA</button>
    </div>
  </div>

  <div id="message" class="page typed-page">
    <div class="msg-container">
      <div class="msg-line" data-text="Aku tahu, aku salah."></div>
      <div class="msg-line" data-text="Bukan bermaksud menyakitimu, tapi kenyataannya aku sudah melakukannya."></div>
      <div class="msg-line" data-text="Kamu berhak marah, berhak kecewa."></div>
      <div class="msg-divider"></div>
      <div class="msg-line" data-text="Tapi aku harap kamu tahu &mdash; aku benar-benar menyesal."></div>
      <!-- <div class="msg-line" data-text="Kamu terlalu berarti untuk aku biarkan pergi begitu saja."></div> -->
      <div class="msg-line signature" data-text="&mdash; dari Mass hehe"></div>
    </div>
    <button class="btn-next ripple-wrap" onclick="goNext('feelings')">LANJUT</button>
  </div>

  <div id="feelings" class="page typed-page">
    <div class="msg-container">
      <div class="msg-line" data-text="Aku sering kepikiran,"></div>
      <div class="msg-line" data-text="apakah kamu masih marah?"></div>
      <!-- <div class="msg-line" data-text="Apakah kamu masih ingat hal-hal baik yang pernah kita lewati?"></div> -->
      <div class="msg-divider"></div>
      <div class="msg-line" data-text="Aku benar-benar menyesali itu"></div>
      <!-- <div class="msg-line emphasis" data-text="Dan aku tidak mau kehilangan itu."></div> -->
    </div>
    <button class="btn-next ripple-wrap" onclick="goNext('promise')">LANJUT</button>
  </div>

  <div id="promise" class="page typed-page">
    <div class="msg-container">
      <div class="msg-line" data-text="Aku nggak bisa janji jadi sempurna,"></div>
      <div class="msg-line" data-text="tapi aku bisa janji untuk berusaha lebih baik."></div>
      <div class="msg-divider"></div>
      <div class="msg-line" data-text="Lebih sabar. Lebih peka. Lebih mendengarkan."></div>
      <div class="msg-line" data-text="Karena kamu layak mendapatkan itu."></div>
      <div class="msg-line signature" data-text="Aku serius."></div>
    </div>
    <button class="btn-next ripple-wrap" onclick="goNext('closing')">LANJUT</button>
  </div>

  <div id="closing" class="page">
    <div class="closing-text">Jadi, boleh aku minta satu kesempatan lagi?</div>
    <div class="closing-sub">Kali ini aku tidak akan menyia-nyiakannya.</div>
    <button class="btn-next ripple-wrap" onclick="goNext('question')" style="margin-top:40px;">LANJUT</button>
  </div>

  <div id="question" class="page">
    <h2>Maafin aku, ya?</h2>
    <div class="btn-group">
      <button class="btn-yes ripple-wrap" onclick="accepted()">Iya</button>
      <button class="btn-no" onmouseover="dodgeBtn(this)" onclick="dodgeBtn(this)">Nggak</button>
    </div>
    <div class="dodge-hint" id="dodgeHint"></div>
  </div>

  <div id="thankyou" class="page">
    <div class="heart-big">&#10084;</div>
    <h2>Terima kasih...</h2>
    <p>Aku janji akan jadi lebih baik. Untuk kamu, untuk kita.</p>
    <div class="promise-line">mulai dari sekarang</div>
    <div class="tap-hint">tap di mana saja</div>
  </div>

  <button class="mute-btn" id="muteBtn" onclick="toggleMute()" aria-label="Toggle musik">
    <span id="muteIcon">&#9834;</span>
  </button>

  <audio id="bgMusic" src="music/backsound.mp3" loop preload="auto"></audio>

  <div class="page-dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

<script>
  var audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playTone(freq, duration, type, vol) {
    try {
      var ctx = getAudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function soundClick() {
    playTone(600, 0.1, 'sine', 0.05);
    setTimeout(function() { playTone(800, 0.08, 'sine', 0.03); }, 50);
  }

  function soundTick() {
    playTone(1200, 0.02, 'sine', 0.005);
  }

  function soundTransition() {
    playTone(400, 0.4, 'sine', 0.04);
    setTimeout(function() { playTone(500, 0.3, 'sine', 0.03); }, 100);
  }

  function soundChime() {
    var notes = [523, 659, 784, 1047];
    notes.forEach(function(n, i) {
      setTimeout(function() { playTone(n, 0.6, 'sine', 0.05); }, i * 180);
    });
  }

  function soundDodge() {
    playTone(300, 0.12, 'triangle', 0.03);
  }

  function soundHeartTap() {
    playTone(880, 0.15, 'sine', 0.025);
  }

  var pages = ['landing', 'message', 'feelings', 'promise', 'closing', 'question', 'thankyou'];
  var currentPage = 0;

  function updateDots(index) {
    var dots = document.querySelectorAll('.page-dots .dot');
    dots.forEach(function(d, i) {
      d.classList.toggle('active', i === index);
    });
  }

  function createRipple(e, el) {
    var rect = el.getBoundingClientRect();
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    el.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
  }

  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.ripple-wrap');
    if (btn) createRipple(e, btn);
  });

  (function() {
    var inner = document.querySelector('.landing-inner');
    var landing = document.getElementById('landing');

    for (var i = 0; i < 12; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = 4 + Math.random() * 10;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.bottom = '-20px';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      landing.appendChild(p);
    }

    landing.addEventListener('mousemove', function(e) {
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight / 2;
      var dx = (e.clientX - cx) / cx;
      var dy = (e.clientY - cy) / cy;
      inner.style.transform = 'translate(' + (dx * -10) + 'px, ' + (dy * -10) + 'px)';
    });
    landing.addEventListener('mouseleave', function() {
      inner.style.transform = 'translate(0, 0)';
    });
  })();

  function transitionTo(pageId, cb) {
    var current = document.querySelector('.page.active');
    var target = document.getElementById(pageId);
    if (current === target) return;

    soundTransition();
    current.classList.add('leaving');
    current.classList.remove('active');

    var idx = pages.indexOf(pageId);
    currentPage = idx;
    updateDots(idx);

    setTimeout(function() {
      current.classList.remove('leaving');
      target.classList.add('active');
      if (cb) cb();
    }, 400);
  }

  var bgMusic = document.getElementById('bgMusic');
  var isMuted = false;
  var musicStarted = false;

  function startMusic() {
    if (musicStarted) return;
    musicStarted = true;
    bgMusic.volume = 0.35;
    bgMusic.play().then(function() {
      document.getElementById('muteBtn').classList.add('started');
    }).catch(function() {
      document.getElementById('muteBtn').classList.add('error');
    });
  }

  function toggleMute() {
    isMuted = !isMuted;
    bgMusic.muted = isMuted;
    document.getElementById('muteIcon').innerHTML = isMuted ? '&#9834;&#10005;' : '&#9834;';
    document.getElementById('muteBtn').classList.toggle('muted', isMuted);
  }

  function handleOpen() {
    soundClick();
    startMusic();
    transitionTo('message', function() {
      typePageMessages('message');
    });
  }

  function goNext(pageId) {
    soundClick();
    transitionTo(pageId, function() {
      var typedPages = ['message', 'feelings', 'promise'];
      if (typedPages.indexOf(pageId) !== -1) {
        typePageMessages(pageId);
      }
      if (pageId === 'closing') {
        revealClosing();
      }
    });
  }

  function typePageMessages(pageId) {
    var page = document.getElementById(pageId);
    var lines = page.querySelectorAll('.msg-line');
    var btn = page.querySelector('.btn-next');
    var divider = page.querySelector('.msg-divider');

    var elements = Array.prototype.slice.call(lines);
    var texts = elements.map(function(el) {
      var t = el.getAttribute('data-text');
      var tmp = document.createElement('span');
      tmp.innerHTML = t;
      return tmp.textContent;
    });

    elements.forEach(function(el) {
      el.innerHTML = '';
      el.classList.remove('visible', 'done');
    });
    if (btn) btn.classList.remove('visible');
    if (divider) divider.classList.remove('visible');

    typeNextLine(0, elements, texts, btn, divider);
  }

  function typeNextLine(index, elements, texts, btn, divider) {
    if (index >= elements.length) {
      setTimeout(function() {
        if (btn) btn.classList.add('visible');
      }, 300);
      return;
    }

    var el = elements[index];
    var text = texts[index];
    el.classList.add('visible');
    el.innerHTML = '<span class="cursor"></span>';

    var charIndex = 0;
    var speed = 22;
    var tickCounter = 0;

    function typeChar() {
      if (charIndex < text.length) {
        el.innerHTML = text.substring(0, charIndex + 1) + '<span class="cursor"></span>';
        charIndex++;
        tickCounter++;
        if (tickCounter % 5 === 0) soundTick();
        setTimeout(typeChar, speed);
      } else {
        el.classList.add('done');
        el.innerHTML = text;

        if (divider && el.nextElementSibling === divider) {
          setTimeout(function() {
            divider.classList.add('visible');
          }, 200);
        }

        setTimeout(function() {
          typeNextLine(index + 1, elements, texts, btn, divider);
        }, 400);
      }
    }

    setTimeout(typeChar, 200);
  }

  function revealClosing() {
    var text = document.querySelector('#closing .closing-text');
    var sub = document.querySelector('#closing .closing-sub');
    var btn = document.querySelector('#closing .btn-next');

    setTimeout(function() { text.classList.add('visible'); }, 300);
    setTimeout(function() { sub.classList.add('visible'); }, 1400);
    setTimeout(function() { btn.classList.add('visible'); }, 2200);
  }

  var dodgeCount = 0;
  var dodgeMessages = [
    'Yakin nih...?',
    'Coba pikir lagi...',
    'Aku serius loh',
    'Please...',
    'Aku nggak akan nyerah'
  ];

  function dodgeBtn(btn) {
    dodgeCount++;
    var yesBtn = document.querySelector('.btn-yes');
    var hint = document.getElementById('dodgeHint');
    soundDodge();

    if (dodgeCount <= dodgeMessages.length) {
      hint.textContent = dodgeMessages[dodgeCount - 1];
      hint.classList.add('visible');
    }

    if (dodgeCount >= 6) {
      btn.style.fontSize = '0.65rem';
      btn.style.padding = '4px 12px';
      btn.style.opacity = '0.25';
      btn.style.border = '1px solid #ddd';
      yesBtn.style.transform = 'scale(1.35)';
      hint.textContent = 'Tombolnya udah capek kabur...';
      return;
    }

    var maxX = window.innerWidth - btn.offsetWidth - 20;
    var maxY = window.innerHeight - btn.offsetHeight - 20;
    var randX = Math.max(10, Math.floor(Math.random() * maxX));
    var randY = Math.max(10, Math.floor(Math.random() * maxY));

    btn.style.position = 'fixed';
    btn.style.left = randX + 'px';
    btn.style.top = randY + 'px';
    btn.style.zIndex = '10';

    if (dodgeCount >= 3) {
      var s = 1 + (dodgeCount * 0.07);
      yesBtn.style.transform = 'scale(' + s + ')';
    }
  }

  function accepted() {
    soundClick();
    transitionTo('thankyou', function() {
      setTimeout(function() {
        soundChime();
        spawnConfetti();
      }, 300);
    });
  }

  function spawnConfetti() {
    var colors = ['#c4978a', '#d4a5a5', '#e8cfc4', '#f0ddd5', '#b0857a', '#dbb8ae', '#e6c2b5'];
    var shapes = ['50%', '2px', '0'];
    for (var i = 0; i < 80; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      var w = 5 + Math.random() * 8;
      var h = Math.random() > 0.5 ? w : w * (1.5 + Math.random());
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      piece.style.animationDelay = (Math.random() * 1.8) + 's';
      piece.style.width = w + 'px';
      piece.style.height = h + 'px';
      piece.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
      document.body.appendChild(piece);
      (function(el) {
        setTimeout(function() { el.remove(); }, 7000);
      })(piece);
    }
  }

  document.getElementById('thankyou').addEventListener('click', function(e) {
    if (!this.classList.contains('active')) return;
    soundHeartTap();
    var heart = document.createElement('div');
    heart.className = 'touch-heart';
    var hearts = ['\u2764', '\u2665', '\u2661', '\u2763'];
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = e.clientX + 'px';
    heart.style.top = e.clientY + 'px';
    document.body.appendChild(heart);
    setTimeout(function() { heart.remove(); }, 1500);
  });

  var touchCount = 0;
  var thankyouPage = document.getElementById('thankyou');
  var bonusMessages = [
    null, null, null, null, null,
    'aku sayang kamu',
    null, null, null, null,
    'selalu',
  ];

  thankyouPage.addEventListener('click', function() {
    if (!this.classList.contains('active')) return;
    touchCount++;
    if (touchCount < bonusMessages.length && bonusMessages[touchCount]) {
      var hint = thankyouPage.querySelector('.tap-hint');
      if (hint) {
        hint.textContent = bonusMessages[touchCount];
        hint.style.opacity = '1';
        hint.style.animation = 'none';
        setTimeout(function() {
          hint.style.animation = 'fadeUp 0.6s ease forwards';
        }, 10);
      }
    }
  });
</script>

</body>
</html>
